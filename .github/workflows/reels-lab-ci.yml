name: Reels Lab code smoke tests
on:
  push:
    paths:
      - "reels_lab/**"
      - ".github/workflows/reels-lab-ci.yml"
  pull_request:
    paths:
      - "reels_lab/**"
      - ".github/workflows/reels-lab-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r reels_lab/requirements-base.txt
      - run: python -m compileall -q reels_lab
      - run: python -m unittest discover -s reels_lab/tests -v
      - run: python -m reels_lab.cli --dry-run
      - run: python -m reels_lab.tests.smoke_render
      - uses: actions/upload-artifact@v4
        with:
          name: reels-synthetic-smoke-NOT-final
          path: reels_lab/out/ci_synthetic_no_voice.mp4
          if-no-files-found: error
          retention-days: 3
